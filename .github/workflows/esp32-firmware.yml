name: ESP32 Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build M5StickS3 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -d esp32

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqualife-m5sticks3-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            esp32/.pio/build/m5sticks3/firmware.bin
            esp32/.pio/build/m5sticks3/firmware.elf
            esp32/.pio/build/m5sticks3/bootloader.bin
            esp32/.pio/build/m5sticks3/partitions.bin
            esp32/include/build_info.h
